name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - uses: flox/install-flox-action@v2
        if: env.ACT != 'true'

      - name: Verify via Flox (verify:ci)
        if: env.ACT != 'true'
        uses: flox/activate-action@v1
        with:
          command: bun run verify:ci

      - name: Verify in Act runner
        if: env.ACT == 'true'
        run: bun run verify:ci
