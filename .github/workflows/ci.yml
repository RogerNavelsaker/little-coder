name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        if: env.ACT == 'true'
        with:
          bun-version: 1.3.13

      - uses: cachix/install-nix-action@v31
        if: env.ACT != 'true'

      - uses: cachix/cachix-action@v16
        if: env.ACT != 'true'
        with:
          name: devenv

      - name: Install devenv
        if: env.ACT != 'true'
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Verify in devenv
        if: env.ACT != 'true'
        run: devenv shell -- bash -e -c 'bun install --frozen-lockfile && bun run verify:ci'

      - name: Verify in Act runner
        if: env.ACT == 'true'
        run: bun install --frozen-lockfile && bun run verify:ci
